name: cli-publish

# Publishes the native Rust Trumbo CLI (@trumbodev/cli) to npm.
#
# The CLI is the Rust TUI at projects/trumbo-cli (fork of grok-build → Trumbo
# provider). On a `cli-vX.Y.Z` tag (or a confirmed dispatch) CI builds the
# release binary natively per platform, packages it with the grok-style npm
# wrapper + platform packages (see projects/trumbo-cli/crates/codegen/xai-grok-pager/npm/),
# and publishes the 7 `@trumbodev/cli*` packages with Trusted Publishing.
#
# Compatibility with the VS Code extension and Trumbo Code desktop app: those
# apps consume @trumbodev/core (the SDK), not @trumbodev/cli. A guard in
# publish-main asserts they never import the CLI package so the native swap
# cannot break them.

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Which publish flow to run"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - nightly
      git_tag:
        description: "Existing release tag to publish when publish_target=main, for example cli-v3.9.0"
        required: false
        type: string
      confirm_publish:
        description: 'Required when publish_target=main. Type "publish" to confirm release publish.'
        required: false
        type: string
      force_nightly_publish:
        description: "Force nightly publish even with no commits in last 24h"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cli-publish-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.git_tag || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  # Native Rust release build per platform. ARM rows (linux-arm64, win32-arm64)
  # and the Intel mac row are best-effort: the required macos-arm64 build is the
  # publish gate (the only OS whose binary we cannot execute from Ubuntu), and
  # missing best-effort artifacts are simply skipped at assemble time.
  build:
    name: Build trumbo (${{ matrix.name }})
    if: github.repository == 'xedro98/Trumbo'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: darwin-arm64,  os: macos-14,       artifact: trumbo-darwin-arm64, bin: target/release/xai-grok-pager,                          exe: "",  protoc: brew,                    required: true  }
          - { name: darwin-x64,    os: macos-13,       artifact: trumbo-darwin-x64,   bin: target/release/xai-grok-pager,                          exe: "",  protoc: brew,                    required: false }
          - { name: linux-x64,     os: ubuntu-latest,  artifact: trumbo-linux-x64,    bin: target/release/xai-grok-pager,                          exe: "",  protoc: apt,                     required: true  }
          - { name: linux-arm64,   os: ubuntu-latest,  artifact: trumbo-linux-arm64,  bin: target/aarch64-unknown-linux-gnu/release/xai-grok-pager,  exe: "",  protoc: apt,                     required: false }
          - { name: win32-x64,     os: windows-latest, artifact: trumbo-win32-x64,    bin: target/release/xai-grok-pager.exe,                       exe: .exe, protoc: win,                    required: true  }
          - { name: win32-arm64,   os: windows-latest, artifact: trumbo-win32-arm64,  bin: target/aarch64-pc-windows-msvc/release/xai-grok-pager.exe, exe: .exe, protoc: win, required: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    env:
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#cli-v}"
          else
            V="$(node -p "require('./projects/console/package.json').version")"
          fi
          echo "GROK_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building version $V"

      - name: Install protoc (linux)
        if: matrix.protoc == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libsystemd-dev gcc-aarch64-linux-gnu

      - name: Install protoc (macOS)
        if: matrix.protoc == 'brew'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: matrix.protoc == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip" -OutFile "$env:RUNNER_TEMP/protoc.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/protoc.zip" -DestinationPath "$env:RUNNER_TEMP/protoc" -Force
          echo "PROTOC=$env:RUNNER_TEMP\protoc\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$env:RUNNER_TEMP\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Setup Rust 1.94.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Add cross target
        if: runner.os == 'Linux' && matrix.name == 'linux-arm64'
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Add cross target
        if: runner.os == 'Windows' && matrix.name == 'win32-arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build release binary
        working-directory: projects/trumbo-cli
        env:
          RUST_MIN_STACK: "33554432"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "linux-arm64" ]; then
            cargo build --release --target aarch64-unknown-linux-gnu -p xai-grok-pager-bin
          elif [ "${{ matrix.name }}" = "win32-arm64" ]; then
            cargo build --release --target aarch64-pc-windows-msvc -p xai-grok-pager-bin
          else
            cargo build --release -p xai-grok-pager-bin
          fi

      - name: Stage binary
        working-directory: projects/trumbo-cli
        run: |
          set -euo pipefail
          test -f "${{ matrix.bin }}" || { echo "missing ${{ matrix.bin }}"; exit 1; }
          mkdir -p "staging/${{ matrix.artifact }}"
          cp "${{ matrix.bin }}" "staging/${{ matrix.artifact }}/trumbo${{ matrix.exe }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: projects/trumbo-cli/staging/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  publish-main:
    name: Publish trumbo (main)
    permissions:
      contents: write
      id-token: write
    needs: build
    if: |
      github.repository == 'xedro98/Trumbo' &&
      !endsWith(github.actor, '[bot]') &&
      (
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/cli-v')
        ) ||
        (
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.publish_target == 'main' &&
          github.event.inputs.confirm_publish == 'publish'
        )
      )
    runs-on: ubuntu-latest
    env:
      SLACK_RELEASE_BOT_TOKEN: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.git_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm install -g sigstore

      - name: Validate release tag
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.git_tag || github.ref_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Release tag is required"
            exit 1
          fi

          if ! printf "%s\n" "$TAG" | grep -Eq '^cli-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "git_tag must look like cli-vX.Y.Z, got: ${TAG}"
            exit 1
          fi

          VERSION="${TAG#cli-v}"
          PACKAGE_VERSION=$(node -p "require('./projects/console/package.json').version")

          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "projects/console/package.json version ${PACKAGE_VERSION} does not match ${TAG}"
            exit 1
          fi

          if ! printf "%s\n" "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "projects/console/package.json has invalid version: ${VERSION}"
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "${TAG} does not point at the checked out commit"
            exit 1
          fi

          git fetch origin +main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$HEAD_COMMIT" origin/main; then
            echo "${TAG} is not reachable from origin/main"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Compatibility guard (extension/desktop must not import @trumbodev/cli)
        run: |
          set -euo pipefail
          HITS=$(grep -rn 'from "@trumbodev/cli"\|require("@trumbodev/cli")' \
            projects/vscode/src projects/trumbo-code/apps \
            --include="*.ts" --include="*.tsx" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            printf '%s\n' "$HITS"
            echo "Found @trumbodev/cli usage in the extension/desktop — the native swap would break them."
            exit 1
          fi
          echo "OK: VS Code extension and desktop app consume the SDK, not @trumbodev/cli."

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set wrapper version + optionalDependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "projects/trumbo-cli/crates/codegen/xai-grok-pager/npm/cli/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = process.env.VERSION;
            for (const k of Object.keys(pkg.optionalDependencies || {})) pkg.optionalDependencies[k] = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 4) + "\n");
          '
          echo "wrapper -> version ${{ steps.version.outputs.version }}"

      - name: Assemble platform packages
        env:
          TRUMBO_ALLOW_MISSING: "1"
          XAI_ROOT: ${{ github.workspace }}/projects/trumbo-cli
          TRUMBO_DARWIN_ARM64: artifacts/trumbo-darwin-arm64/trumbo
          TRUMBO_DARWIN_X64: artifacts/trumbo-darwin-x64/trumbo
          TRUMBO_LINUX_X64: artifacts/trumbo-linux-x64/trumbo
          TRUMBO_LINUX_ARM64: artifacts/trumbo-linux-arm64/trumbo
          TRUMBO_WIN32_X64: artifacts/trumbo-win32-x64/trumbo.exe
          TRUMBO_WIN32_ARM64: artifacts/trumbo-win32-arm64/trumbo.exe
        run: |
          set -euo pipefail
          ls -la artifacts
          node projects/trumbo-cli/crates/codegen/xai-grok-pager/npm/cli/scripts/assemble-platform-packages.js

      - name: Verify assembled packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd projects/trumbo-cli/crates/codegen/xai-grok-pager/npm
          for dir in cli-*; do
            if [ -f "$dir/package.json" ]; then
              name=$(node -p "require('./$dir/package.json').name")
              ver=$(node -p "require('./$dir/package.json').version")
              br=$(ls "$dir"/bin/*.br 2>/dev/null || true)
              echo "$name@$ver  br=$br"
              test "$ver" = "$VERSION" || { echo "version mismatch in $dir"; exit 1; }
            fi
          done

      - name: Publish to NPM with latest tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd projects/trumbo-cli/crates/codegen/xai-grok-pager/npm
          for dir in cli-*; do
            if [ -f "$dir/package.json" ] && ls "$dir"/bin/*.br >/dev/null 2>&1; then
              name=$(node -p "require('./$dir/package.json').name")
              if npm view "$name@$VERSION" version >/dev/null 2>&1; then
                echo "already published: $name@$VERSION (skip)"
                continue
              fi
              echo "publishing $name@$VERSION"
              npm publish "$dir" --access public --tag latest --provenance
            fi
          done
          # Wrapper last so the optionalDependencies resolve to already-published packages.
          if ! npm view "@trumbodev/cli@$VERSION" version >/dev/null 2>&1; then
            echo "publishing @trumbodev/cli@$VERSION"
            npm publish cli --access public --tag latest --provenance
          else
            echo "already published: @trumbodev/cli@$VERSION (skip)"
          fi

      - name: Get Previous CLI Tag
        id: prev_tag
        env:
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'cli-v*' "$CURRENT_TAG^" 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Get Changelog Entry
        id: changelog
        run: |
          CONTENT=$(awk '/^## [0-9]/{if(found) exit; found=1; next} found{print}' projects/trumbo-cli/CHANGELOG.md)
          if [ -z "$CONTENT" ]; then CONTENT="Release notes for @trumbodev/cli."; fi
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CLI v${{ steps.version.outputs.version }}"
          body: |
            ${{ steps.changelog.outputs.content }}

            ${{ steps.prev_tag.outputs.prev_tag != '' && format('**Full Changelog**: https://github.com/{0}/compare/{1}...{2}', github.repository, steps.prev_tag.outputs.prev_tag, steps.version.outputs.tag) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Published @trumbodev/cli@${VERSION} (native Rust TUI) to npm with dist-tag 'latest'"
          echo "Install with: npm install -g @trumbodev/cli"
          echo "Platforms: Windows / macOS / Linux"

      - name: Post release to Slack
        if: ${{ env.SLACK_RELEASE_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
          payload: |
            channel: "C0APVKGGZFC"
            text: "Trumbo CLI v${{ steps.version.outputs.version }} (native Rust TUI)"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Trumbo CLI v${{ steps.version.outputs.version }} — native Rust TUI"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ${{ toJSON(steps.changelog.outputs.content) }}
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<https://www.npmjs.com/package/@trumbodev/cli/v/${{ steps.version.outputs.version }}|View on npm>${{ steps.prev_tag.outputs.prev_tag != '' && format(' | Full Changelog: https://github.com/{0}/compare/{1}...{2}', github.repository, steps.prev_tag.outputs.prev_tag, steps.version.outputs.tag) || '' }}"

  publish-nightly:
    name: Publish trumbo (nightly)
    permissions:
      contents: read
      id-token: write
    needs: build
    if: |
      github.repository == 'xedro98/Trumbo' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.publish_target == 'nightly'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent commits
        id: check_commits
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_nightly_publish == 'true' }}
        run: |
          if [ "$FORCE_PUBLISH" = "true" ]; then
            echo "force_nightly_publish enabled, proceeding with publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-list --count HEAD --since='24 hours ago')" -eq 0 ]; then
            echo "No commits in last 24 hours, skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found recent commits, proceeding with publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check_commits.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifacts
        if: steps.check_commits.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate nightly version
        if: steps.check_commits.outputs.skip != 'true'
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./projects/console/package.json').version")
          VERSION="${BASE_VERSION}-nightly.$(date +%s)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Generated nightly version ${VERSION}"

      - name: Set wrapper version + optionalDependencies
        if: steps.check_commits.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "projects/trumbo-cli/crates/codegen/xai-grok-pager/npm/cli/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = process.env.VERSION;
            for (const k of Object.keys(pkg.optionalDependencies || {})) pkg.optionalDependencies[k] = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 4) + "\n");
          '

      - name: Assemble platform packages
        if: steps.check_commits.outputs.skip != 'true'
        env:
          TRUMBO_ALLOW_MISSING: "1"
          XAI_ROOT: ${{ github.workspace }}/projects/trumbo-cli
          TRUMBO_DARWIN_ARM64: artifacts/trumbo-darwin-arm64/trumbo
          TRUMBO_DARWIN_X64: artifacts/trumbo-darwin-x64/trumbo
          TRUMBO_LINUX_X64: artifacts/trumbo-linux-x64/trumbo
          TRUMBO_LINUX_ARM64: artifacts/trumbo-linux-arm64/trumbo
          TRUMBO_WIN32_X64: artifacts/trumbo-win32-x64/trumbo.exe
          TRUMBO_WIN32_ARM64: artifacts/trumbo-win32-arm64/trumbo.exe
        run: |
          node projects/trumbo-cli/crates/codegen/xai-grok-pager/npm/cli/scripts/assemble-platform-packages.js

      - name: Publish to NPM with nightly tag
        if: steps.check_commits.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd projects/trumbo-cli/crates/codegen/xai-grok-pager/npm
          for dir in cli-*; do
            if [ -f "$dir/package.json" ] && ls "$dir"/bin/*.br >/dev/null 2>&1; then
              name=$(node -p "require('./$dir/package.json').name")
              if npm view "$name@$VERSION" version >/dev/null 2>&1; then
                echo "already published: $name@$VERSION (skip)"
                continue
              fi
              npm publish "$dir" --access public --tag nightly --provenance
            fi
          done
          if ! npm view "@trumbodev/cli@$VERSION" version >/dev/null 2>&1; then
            npm publish cli --access public --tag nightly --provenance
          else
            echo "already published: @trumbodev/cli@$VERSION (skip)"
          fi

      - name: Summary
        if: steps.check_commits.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Published @trumbodev/cli@${VERSION} to npm with dist-tag 'nightly'"
          echo "Install with: npm install -g @trumbodev/cli@nightly"
