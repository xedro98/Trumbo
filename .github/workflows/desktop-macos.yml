name: Build macOS Desktop
on:
  push:
    branches:
      - main
    paths:
      - "projects/trumbo-code/**"
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture (arm64 or x64)"
        required: false
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  contents: read

jobs:
  build:
    # On `workflow_dispatch` uses the chosen arch; on `push` inputs.arch is empty
    # (the input default only applies to manual dispatch), so fall back to arm64.
    name: macOS ${{ inputs.arch || 'arm64' }}
    runs-on: ${{ inputs.arch == 'x64' && 'macos-13' || 'macos-14' }}
    timeout-minutes: 45
    env:
      DESKTOP_ARCH: ${{ inputs.arch || 'arm64' }}
    defaults:
      run:
        working-directory: projects/trumbo-code
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: projects/trumbo-code/package.json
          cache: true

      - name: Install trumbo-code dependencies (pnpm)
        working-directory: projects/trumbo-code
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm install --no-frozen-lockfile

      - name: Ensure Electron runtime
        run: vp run --filter @trumbo-code/desktop ensure:electron

      - name: Build desktop DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch "${{ env.DESKTOP_ARCH }}" \
            --verbose

      # Launch the built Electron main process headlessly and fail if it crashes
      # at startup (MODULE_NOT_FOUND, Uncaught Error, etc.). Previously the macOS
      # app was only ever hand-built and never executed in CI, so main-process
      # crashes shipped in every DMG.
      - name: Smoke-test Electron main process
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          vp run --filter @trumbo-code/desktop smoke-test

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for f in release/*.dmg release/*.zip release/*.yml release/*.blockmap; do
            [ -f "$f" ] && cp "$f" release-publish/
          done
          ls -lh release-publish/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-${{ env.DESKTOP_ARCH }}
          path: projects/trumbo-code/release-publish/*
          if-no-files-found: error
          retention-days: 14
