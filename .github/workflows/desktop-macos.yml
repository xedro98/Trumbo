name: Build macOS Desktop
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture (arm64 or x64)"
        required: false
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-14' || 'macos-13' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/trumbo-code
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: projects/trumbo-code/package.json
          cache: true

      - name: Install trumbo-code dependencies (pnpm)
        working-directory: projects/trumbo-code
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm install --frozen-lockfile

      - name: Ensure Electron runtime
        run: vp run --filter @trumbo-code/desktop ensure:electron

      - name: Build desktop DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch "${{ inputs.arch }}" \
            --verbose

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for f in release/*.dmg release/*.zip release/*.yml release/*.blockmap; do
            [ -f "$f" ] && cp "$f" release-publish/
          done
          ls -lh release-publish/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-${{ inputs.arch }}
          path: projects/trumbo-code/release-publish/*
          if-no-files-found: error
          retention-days: 14
