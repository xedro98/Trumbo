name = "trumbo-docs"
main = "src/index.ts"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

# Custom domain: wrangler auto-provisions DNS + SSL for docs.trumbo.dev.
# Traffic is reverse-proxied to Mintlify (trumbo.mintlify.app).
routes = [
	{ pattern = "docs.trumbo.dev", custom_domain = true },
]
